<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map4D POI Delete Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">Map4D POI Delete Tool</h1>

        <!-- Auth Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Authentication</h2>
            <div class="flex gap-4 items-end">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Authorization Token</label>
                    <input type="text" id="tokenInput" placeholder="Bearer xxxxxxxxxxxxxxxxx" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button id="btnCheckToken" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition-colors flex items-center gap-2">
                    <span id="btnCheckTokenText">Kiểm tra Token</span>
                    <div id="btnCheckTokenLoader" class="loader hidden"></div>
                </button>
            </div>
            <p id="tokenStatusMessage" class="mt-2 text-sm hidden"></p>
        </div>

        <!-- Mode Selection -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Chế độ xóa</h2>
            <div class="flex gap-6 mb-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="mode" value="manual" checked class="text-blue-600 focus:ring-blue-500 h-4 w-4">
                    <span class="text-gray-700">Nhập ID thủ công</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="mode" value="file" class="text-blue-600 focus:ring-blue-500 h-4 w-4">
                    <span class="text-gray-700">Upload file CSV / Excel</span>
                </label>
            </div>

            <!-- Manual Mode -->
            <div id="manualModeContainer" class="block">
                <div class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Place ID</label>
                        <input type="text" id="manualIdInput" placeholder="Nhập Place ID cần xóa" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button id="btnDeleteManual" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-md transition-colors flex items-center gap-2">
                        Xóa POI
                    </button>
                </div>
            </div>

            <!-- File Mode -->
            <div id="fileModeContainer" class="hidden">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Upload file dữ liệu (.csv, .xlsx)</label>
                        <input type="file" id="fileInput" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Khôi phục Checkpoint JSON (Tuỳ chọn)</label>
                        <input type="file" id="checkpointInput" accept=".json" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200">
                    </div>
                </div>

                <div id="filePreviewContainer" class="hidden mt-6">
                    <h3 class="text-lg font-medium text-gray-800 mb-2">Preview Dữ liệu</h3>
                    <div class="overflow-x-auto border border-gray-200 rounded-md mb-4 max-h-64">
                        <table class="min-w-full divide-y divide-gray-200" id="previewTable">
                            <thead class="bg-gray-50 sticky top-0" id="previewTableHead"></thead>
                            <tbody class="bg-white divide-y divide-gray-200 text-sm" id="previewTableBody"></tbody>
                        </table>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Chọn cột ID để xóa</label>
                            <select id="idColumnSelect" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Số dòng hợp lệ (có ID)</label>
                            <input type="text" id="validRowsCount" disabled class="w-full border border-gray-200 bg-gray-50 rounded-md px-3 py-2 text-gray-500">
                        </div>
                    </div>

                    <!-- Progress and Controls -->
                    <div class="bg-gray-50 p-4 rounded-md border border-gray-200 mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-medium text-gray-700" id="progressStatusText">Trạng thái: Đang chờ</span>
                            <span class="text-sm font-medium text-gray-700" id="progressCountText">0/0 dòng | 0.00%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4">
                            <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        
                        <div class="flex gap-3 flex-wrap" id="actionButtonsContainer">
                            <button id="btnStartDelete" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-md transition-colors">Start Delete</button>
                            <button id="btnPauseDelete" class="bg-yellow-500 hover:bg-yellow-600 text-white font-medium py-2 px-4 rounded-md transition-colors hidden">Pause Delete</button>
                            <button id="btnResumeDelete" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md transition-colors hidden">Resume Delete</button>
                            
                            <div class="ml-auto flex gap-2">
                                <button id="btnDownloadCheckpoint" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition-colors hidden flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                                    </svg>
                                    Save Checkpoint JSON
                                </button>
                                <button id="btnDownloadResult" class="bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-4 rounded-md transition-colors hidden flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                    </svg>
                                    Download Result CSV
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="resultContainer" class="hidden">
                        <h3 class="text-lg font-medium text-gray-800 mb-2">Kết quả</h3>
                        <div class="overflow-x-auto border border-gray-200 rounded-md max-h-96">
                            <table class="min-w-full divide-y divide-gray-200" id="resultTable">
                                <thead class="bg-gray-50 sticky top-0" id="resultTableHead"></thead>
                                <tbody class="bg-white divide-y divide-gray-200 text-sm" id="resultTableBody"></tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://api-data.map4d.vn/map/manage/place/delete/";
        const MAX_PARALLEL_REQUESTS = 20; // Tăng luồng song song lên 20
        const DELETE_CHUNK_SIZE = 100; // Xử lý 100 dòng mỗi đợt
        
        let globalData = [];
        let globalHeaders = [];
        let candidateRows = [];
        let processState = {
            status: 'idle', // idle, running, paused, completed
            processedIndices: new Set(),
            results: [],
            total: 0,
            shouldStop: false,
            fileKey: ''
        };

        // DOM Elements
        const tokenInput = document.getElementById('tokenInput');
        const btnCheckToken = document.getElementById('btnCheckToken');
        const tokenStatusMessage = document.getElementById('tokenStatusMessage');
        const modeRadios = document.getElementsByName('mode');
        const manualModeContainer = document.getElementById('manualModeContainer');
        const fileModeContainer = document.getElementById('fileModeContainer');
        const manualIdInput = document.getElementById('manualIdInput');
        const btnDeleteManual = document.getElementById('btnDeleteManual');
        const fileInput = document.getElementById('fileInput');
        const checkpointInput = document.getElementById('checkpointInput');
        const filePreviewContainer = document.getElementById('filePreviewContainer');
        const previewTableHead = document.getElementById('previewTableHead');
        const previewTableBody = document.getElementById('previewTableBody');
        const idColumnSelect = document.getElementById('idColumnSelect');
        const validRowsCount = document.getElementById('validRowsCount');
        
        const btnStartDelete = document.getElementById('btnStartDelete');
        const btnPauseDelete = document.getElementById('btnPauseDelete');
        const btnResumeDelete = document.getElementById('btnResumeDelete');
        const btnDownloadResult = document.getElementById('btnDownloadResult');
        const btnDownloadCheckpoint = document.getElementById('btnDownloadCheckpoint');
        
        const progressStatusText = document.getElementById('progressStatusText');
        const progressCountText = document.getElementById('progressCountText');
        const progressBar = document.getElementById('progressBar');
        const resultContainer = document.getElementById('resultContainer');

        // Helpers
        function getHeaders() {
            return {
                "accept": "text/plain",
                "Authorization": tokenInput.value.trim()
            };
        }

        async function checkToken(showPopup = true) {
            const token = tokenInput.value.trim();
            if (!token) {
                if(showPopup) Swal.fire('Lỗi', 'Vui lòng nhập Authorization Token', 'error');
                return false;
            }

            if(showPopup) {
                document.getElementById('btnCheckTokenText').classList.add('hidden');
                document.getElementById('btnCheckTokenLoader').classList.remove('hidden');
            }

            try {
                // Test URL with invalid ID just to check Auth
                const res = await fetch(`${API_BASE_URL}test_invalid_id`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                
                if (showPopup) {
                    document.getElementById('btnCheckTokenText').classList.remove('hidden');
                    document.getElementById('btnCheckTokenLoader').classList.add('hidden');
                }

                if (res.status === 401) {
                    tokenStatusMessage.textContent = 'Token không hợp lệ hoặc đã hết hạn (401).';
                    tokenStatusMessage.className = 'mt-2 text-sm text-red-600 block';
                    if(showPopup) Swal.fire('Lỗi', 'Token không hợp lệ hoặc đã hết hạn.', 'error');
                    return false;
                }
                
                tokenStatusMessage.textContent = 'Token hợp lệ.';
                tokenStatusMessage.className = 'mt-2 text-sm text-green-600 block';
                if(showPopup) Swal.fire('Thành công', 'Token hợp lệ.', 'success');
                return true;

            } catch (err) {
                if (showPopup) {
                    document.getElementById('btnCheckTokenText').classList.remove('hidden');
                    document.getElementById('btnCheckTokenLoader').classList.add('hidden');
                }
                tokenStatusMessage.textContent = `Lỗi kết nối: ${err.message}`;
                tokenStatusMessage.className = 'mt-2 text-sm text-red-600 block';
                if(showPopup) Swal.fire('Lỗi Kết Nối', `Không thể kết nối API. Chi tiết: ${err.message}. Có thể do lỗi CORS, vui lòng bật F12 để kiểm tra.`, 'error');
                return false;
            }
        }

        async function deletePlace(id) {
            try {
                const res = await fetch(`${API_BASE_URL}${id}`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (res.ok) {
                    return { success: true, message: 'Deleted successfully', stop: false };
                }
                const text = await res.text();
                return { success: false, message: `${res.status} - ${text}`, stop: false };
            } catch (err) {
                return { success: false, message: err.message, stop: true }; // Network/CORS error
            }
        }

        // Event Listeners
        btnCheckToken.addEventListener('click', () => checkToken(true));

        modeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'manual') {
                    manualModeContainer.classList.remove('hidden');
                    fileModeContainer.classList.add('hidden');
                } else {
                    manualModeContainer.classList.add('hidden');
                    fileModeContainer.classList.remove('hidden');
                }
            });
        });

        btnDeleteManual.addEventListener('click', async () => {
            const id = manualIdInput.value.trim();
            if (!id) return Swal.fire('Lỗi', 'Vui lòng nhập Place ID', 'error');
            const isValid = await checkToken(false);
            if (!isValid) return Swal.fire('Lỗi', 'Token không hợp lệ', 'error');

            const btn = btnDeleteManual;
            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> Đang xóa...';

            const result = await deletePlace(id);
            
            btn.disabled = false;
            btn.innerHTML = 'Xóa POI';

            if (result.success) {
                Swal.fire('Thành công', `Đã xóa POI: ${id}`, 'success');
                manualIdInput.value = '';
            } else {
                Swal.fire('Thất bại', `Lỗi xóa POI: ${result.message}`, 'error');
            }
        });

        // JSON Checkpoint Upload logic
        checkpointInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if(!processState.fileKey) {
                        Swal.fire('Lỗi', 'Vui lòng upload file Excel/CSV trước khi nạp checkpoint!', 'error');
                        checkpointInput.value = '';
                        return;
                    }
                    localStorage.setItem(processState.fileKey, JSON.stringify(data));
                    loadCheckpoint();
                    Swal.fire('Thành công', 'Đã nạp checkpoint thành công!', 'success');
                } catch(err) {
                    Swal.fire('Lỗi', 'File Checkpoint không hợp lệ!', 'error');
                }
            };
            reader.readAsText(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) {
                filePreviewContainer.classList.add('hidden');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                globalData = json;
                
                if (json.length > 0) {
                    globalHeaders = Object.keys(json[0]);
                    renderPreviewTable(globalHeaders, json.slice(0, 5)); // show first 5
                    
                    idColumnSelect.innerHTML = '';
                    let hasIdCol = false;
                    globalHeaders.forEach(h => {
                        const option = document.createElement('option');
                        option.value = h;
                        option.textContent = h;
                        idColumnSelect.appendChild(option);
                        if (h.toLowerCase().includes('id') && !hasIdCol) {
                            option.selected = true;
                            hasIdCol = true;
                        }
                    });

                    updateCandidateCount();
                    filePreviewContainer.classList.remove('hidden');
                    
                    // Generate file key for localStorage
                    const hashStr = file.name + file.size + file.lastModified;
                    const hashCode = s => s.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
                    processState.fileKey = `map4d_del_${hashCode(hashStr)}`;
                    
                    loadCheckpoint();
                } else {
                    Swal.fire('Lỗi', 'File không có dữ liệu', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        idColumnSelect.addEventListener('change', updateCandidateCount);

        function updateCandidateCount() {
            const col = idColumnSelect.value;
            candidateRows = [];
            globalData.forEach((row, idx) => {
                const idVal = row[col];
                if (idVal !== undefined && idVal !== null && String(idVal).trim() !== '' && String(idVal).trim().toLowerCase() !== 'nan') {
                    candidateRows.push({ originalIndex: idx, rowData: row, id: String(idVal).trim() });
                }
            });
            validRowsCount.value = candidateRows.length;
            processState.total = candidateRows.length;
            updateProgressUI();
        }

        function renderPreviewTable(headers, data) {
            previewTableHead.innerHTML = `<tr>${headers.map(h => `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">${h}</th>`).join('')}</tr>`;
            previewTableBody.innerHTML = data.map(row => 
                `<tr>${headers.map(h => `<td class="px-6 py-4 whitespace-nowrap text-gray-700">${row[h] || ''}</td>`).join('')}</tr>`
            ).join('');
        }

        // Processing Logic
        function loadCheckpoint() {
            const saved = localStorage.getItem(processState.fileKey);
            if (saved) {
                const parsed = JSON.parse(saved);
                processState.status = parsed.status === 'running' ? 'paused' : parsed.status;
                processState.processedIndices = new Set(parsed.processedIndices);
                processState.results = parsed.results || [];
                
                if (processState.processedIndices.size > 0) {
                    Swal.fire({
                        title: 'Phát hiện tiến trình cũ',
                        text: `Bạn đã xử lý ${processState.processedIndices.size}/${processState.total} dòng trước đó.`,
                        icon: 'info',
                        toast: true,
                        position: 'top-end',
                        showConfirmButton: false,
                        timer: 3000
                    });
                }
            } else {
                processState.status = 'idle';
                processState.processedIndices = new Set();
                processState.results = [];
            }
            updateProgressUI();
        }

        function saveCheckpoint() {
            if(!processState.fileKey) return;
            localStorage.setItem(processState.fileKey, JSON.stringify({
                status: processState.status,
                processedIndices: Array.from(processState.processedIndices),
                results: processState.results
            }));
        }

        function clearCheckpoint() {
            if(!processState.fileKey) return;
            localStorage.removeItem(processState.fileKey);
        }

        function updateProgressUI() {
            const count = processState.processedIndices.size;
            const total = processState.total;
            const percent = total > 0 ? ((count / total) * 100).toFixed(2) : 0;
            
            progressCountText.textContent = `${count}/${total} dòng | ${percent}%`;
            progressBar.style.width = `${percent}%`;
            
            let statusText = 'Đang chờ';
            if (processState.status === 'running') statusText = 'Đang chạy';
            else if (processState.status === 'paused') statusText = 'Tạm dừng';
            else if (processState.status === 'completed') statusText = 'Hoàn thành';
            
            progressStatusText.textContent = `Trạng thái: ${statusText}`;

            // Buttons visibility
            btnStartDelete.classList.toggle('hidden', processState.status === 'running' || (processState.status === 'paused' && count > 0) || processState.status === 'completed');
            if (count > 0 && processState.status !== 'completed' && processState.status !== 'running') {
                btnStartDelete.classList.remove('hidden');
                btnStartDelete.textContent = "Restart New";
            } else {
                btnStartDelete.textContent = "Start Delete";
            }

            btnPauseDelete.classList.toggle('hidden', processState.status !== 'running');
            btnResumeDelete.classList.toggle('hidden', processState.status !== 'paused' || count === 0);
            
            if (processState.results.length > 0) {
                btnDownloadResult.classList.remove('hidden');
                btnDownloadCheckpoint.classList.remove('hidden');
                renderResultTable();
                resultContainer.classList.remove('hidden');
            }
        }

        btnStartDelete.addEventListener('click', async () => {
            const isValid = await checkToken();
            if (!isValid) return;

            if (processState.processedIndices.size > 0) {
                const conf = await Swal.fire({
                    title: 'Bắt đầu lại?',
                    text: "Tiến trình cũ sẽ bị xóa hết.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Đồng ý',
                    cancelButtonText: 'Hủy'
                });
                if (!conf.isConfirmed) return;
            }
            
            clearCheckpoint();
            processState.processedIndices = new Set();
            processState.results = [];
            processState.status = 'running';
            processState.shouldStop = false;
            updateProgressUI();
            processQueue();
        });

        btnPauseDelete.addEventListener('click', () => {
            processState.shouldStop = true;
            processState.status = 'paused';
            saveCheckpoint();
            updateProgressUI();
        });

        btnResumeDelete.addEventListener('click', async () => {
            const isValid = await checkToken();
            if (!isValid) return;

            processState.shouldStop = false;
            processState.status = 'running';
            updateProgressUI();
            processQueue();
        });

        async function processQueue() {
            let pending = [];
            candidateRows.forEach((item, index) => {
                if (!processState.processedIndices.has(index)) {
                    pending.push({ ...item, candidateIndex: index });
                }
            });

            let pointer = 0;
            let rowsProcessedThisRun = 0;

            while (pointer < pending.length && rowsProcessedThisRun < DELETE_CHUNK_SIZE && !processState.shouldStop) {
                const waveSize = Math.min(MAX_PARALLEL_REQUESTS, DELETE_CHUNK_SIZE - rowsProcessedThisRun, pending.length - pointer);
                const wave = pending.slice(pointer, pointer + waveSize);
                pointer += waveSize;

                const promises = wave.map(async (item) => {
                    const result = await deletePlace(item.id);
                    
                    if (!processState.shouldStop) {
                        processState.processedIndices.add(item.candidateIndex);
                        rowsProcessedThisRun++;
                        
                        const logRow = {
                            source_row: item.originalIndex + 2, // Excel rows usually 1-indexed + header
                            time: new Date().toLocaleString('vi-VN'),
                            id: item.id,
                            status: result.success ? 'success' : 'error',
                            message: result.message
                        };
                        
                        // Merge original data with log
                        processState.results.push({ ...item.rowData, ...logRow });
                        
                        // Cập nhật UI ngay lập tức sau mỗi request hoàn thành
                        updateProgressUI();
                    }

                    return { item, result };
                });

                const waveResults = await Promise.all(promises);
                
                let waveStopped = false;
                let stopReason = "";

                waveResults.forEach(({ item, result }) => {
                    if (result.stop) {
                        waveStopped = true;
                        stopReason = result.message;
                    }
                });

                saveCheckpoint();

                if (waveStopped) {
                    processState.shouldStop = true;
                    processState.status = 'paused';
                    saveCheckpoint();
                    updateProgressUI();
                    Swal.fire('Lỗi mạng', `Tiến trình đã tạm dừng do lỗi: ${stopReason}`, 'error');
                    break;
                }
            }

            if (processState.processedIndices.size >= processState.total) {
                processState.status = 'completed';
                saveCheckpoint();
                updateProgressUI();
                Swal.fire('Hoàn thành', 'Đã xử lý xong tất cả dữ liệu!', 'success');
            } else if (!processState.shouldStop) {
                // To prevent max call stack and let UI update
                setTimeout(processQueue, 50); 
            }
        }

        function renderResultTable() {
            if (processState.results.length === 0) return;
            
            const logCols = ['source_row', 'time', 'id', 'status', 'message'];
            const allHeaders = [...globalHeaders, ...logCols.filter(c => !globalHeaders.includes(c))];
            
            document.getElementById('resultTableHead').innerHTML = `<tr>${allHeaders.map(h => `<th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-gray-50">${h}</th>`).join('')}</tr>`;
            
            // Show last 50 results to prevent DOM lag
            const displayData = [...processState.results].reverse().slice(0, 50);
            
            document.getElementById('resultTableBody').innerHTML = displayData.map(row => 
                `<tr>${allHeaders.map(h => {
                    let val = row[h] === undefined || row[h] === null ? '' : row[h];
                    let cls = "px-4 py-2 whitespace-nowrap text-gray-700";
                    if(h === 'status' && val === 'success') cls += " text-green-600 font-bold";
                    if(h === 'status' && val === 'error') cls += " text-red-600 font-bold";
                    return `<td class="${cls}">${val}</td>`;
                }).join('')}</tr>`
            ).join('');
        }

        btnDownloadResult.addEventListener('click', () => {
            if (processState.results.length === 0) return;
            
            const logCols = ['source_row', 'time', 'id', 'status', 'message'];
            const allHeaders = [...globalHeaders, ...logCols.filter(c => !globalHeaders.includes(c))];
            
            // Create CSV content
            let csvContent = "\uFEFF"; // BOM for UTF-8 Excel support
            csvContent += allHeaders.join(",") + "\n";
            
            processState.results.sort((a,b) => a.source_row - b.source_row).forEach(row => {
                const rowArray = allHeaders.map(h => {
                    let val = row[h] === undefined || row[h] === null ? '' : String(row[h]);
                    // Escape quotes and wrap in quotes if contains comma
                    if (val.includes(',') || val.includes('"') || val.includes('\n')) {
                        val = `"${val.replace(/"/g, '""')}"`;
                    }
                    return val;
                });
                csvContent += rowArray.join(",") + "\n";
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "delete_result.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        btnDownloadCheckpoint.addEventListener('click', () => {
            if(!processState.fileKey) return;
            const dataStr = localStorage.getItem(processState.fileKey);
            if(!dataStr) return;
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `checkpoint_${processState.fileKey}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

    </script>
</body>
</html>
