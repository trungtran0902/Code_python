<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMZ on Map4D</title>
       <script defer
    src="https://api.map4d.vn/sdk/map/js?version=2.6&key=93d393d0f6507ee00b62fe01db7430fa&callback=initMap"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
</head>
<body>
    <div id="map" style="width: 100%; height: 100vh;"></div>
    <input type="file" id="fileInput" accept=".kmz">

    <script>
        window.onload = function() {
    function initMap() {
        var map = new map4d.Map(document.getElementById("map"), {
            zoom: 10,
            center: {lat: 10.7769, lng: 106.7009},
        });

        var fileInput = document.getElementById('quyhoach');
        if (fileInput) {
            fileInput.addEventListener('change', function(event) {
                var file = event.target.files[0];
                if (file && file.name.endsWith('.kmz')) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var arrayBuffer = e.target.result;
                        parseKMZ(arrayBuffer, map);
                    };
                    reader.readAsArrayBuffer(file);
                }
            });
        } else {
            console.error('Element with ID "fileInput" not found.');
        }
    }

    function parseKMZ(arrayBuffer, map) {
        JSZip.loadAsync(arrayBuffer).then(function(zip) {
            zip.file(/.*\.kml$/i)[0].async("string").then(function(kmlString) {
                var parser = new DOMParser();
                var kmlDoc = parser.parseFromString(kmlString, "application/xml");
                addKMLToMap(kmlDoc, map);
            });
        });
    }

    function addKMLToMap(kmlDoc, map) {
        var kmlElements = kmlDoc.getElementsByTagName("Placemark");
        for (var i = 0; i < kmlElements.length; i++) {
            var placemark = kmlElements[i];
            var name = placemark.getElementsByTagName("name")[0].textContent;
            var coordinates = placemark.getElementsByTagName("coordinates")[0].textContent.trim();
            var coordArr = coordinates.split(",").map(Number);
            var position = {lat: coordArr[1], lng: coordArr[0]};

            new map4d.Marker({
                position: position,
                title: name,
                map: map,
            });
        }
    }

    initMap();
};

    </script>
</body>
</html>
