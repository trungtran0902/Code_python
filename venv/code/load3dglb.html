<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model on Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 600px;
            width: 100%;
        }
        #threejs-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="threejs-container"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // Initialize Leaflet map
        const map = L.map('map').setView([11.53351778809698, 106.88822411558695], 13);

        L.tileLayer('http://rtile.map4d.vn/all/2d/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Initialize Three.js scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); // Transparent background
        document.getElementById('threejs-container').appendChild(renderer.domElement);

        // Load GLB model
        const loader = new THREE.GLTFLoader();
        loader.load('http://localhost:8000/venv/test.glb', function (gltf) {
            const model = gltf.scene;
            scene.add(model);
            model.position.set(0, 0, 0); // Adjust position as needed
        });

        camera.position.z = 5;

        // Animate and render the scene
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Update Three.js camera position based on map's center
        map.on('move', function () {
            const center = map.getCenter();
            camera.position.set(center.lng, center.lat, 5);
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
