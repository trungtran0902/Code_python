<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xử Lý Categories Foody -> Map4D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="../css/xu_ly_categories.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100 mb-8">
            <div class="flex items-center gap-4 mb-8">
                <div class="bg-orange-500 p-3 rounded-lg shadow-lg shadow-orange-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Xử Lý Categories Foody -> Map4D</h1>
                    <p class="text-slate-500">Mapping danh mục sử dụng file Type Map4D chuẩn.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- Source File -->
                <div class="p-6 border-2 border-dashed border-slate-200 rounded-2xl hover:bg-slate-50 transition-colors">
                    <label class="block text-sm font-bold text-slate-700 mb-2">1. File nguồn (Cần chuyển đổi)</label>
                    <input type="file" id="sourceInput" accept=".xlsx,.xls,.csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
                    <div id="sourceStatus" class="mt-2 text-xs text-slate-500">Chưa chọn file</div>
                </div>

                <!-- Map4D Type File -->
                <div class="p-6 border-2 border-dashed border-slate-200 rounded-2xl hover:bg-slate-50 transition-colors">
                    <label class="block text-sm font-bold text-slate-700 mb-2">2. File Type Map4D chuẩn</label>
                    <input type="file" id="map4dInput" accept=".xlsx,.xls,.csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <div id="map4dStatus" class="mt-2 text-xs text-slate-500">Chưa chọn file</div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button id="btnProcess" disabled class="flex-1 bg-orange-500 hover:bg-orange-600 disabled:bg-slate-300 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2">
                    <span>Bắt Đầu Xử Lý</span>
                    <div id="loaderProcess" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                </button>
            </div>
        </div>

        <div id="resultContainer" class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100 hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800">Kết quả xử lý</h2>
                <button id="btnDownload" class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Tải File Excel (.xlsx)
                </button>
            </div>
            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-600 text-sm font-bold uppercase" id="resultHead"></thead>
                    <tbody id="resultBody" class="divide-y divide-slate-100 text-slate-700 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="../js/xu_ly_categories.js"></script>
</body>
</html>
