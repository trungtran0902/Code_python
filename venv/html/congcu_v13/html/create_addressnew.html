<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map4D - Thêm Cột Địa Chỉ Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link rel="stylesheet" href="../css/create_addressnew.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h1 class="text-3xl font-bold text-blue-700 mb-2">Thêm Cột Địa Chỉ Mới</h1>
            <p class="text-gray-600 mb-6">Gán địa chỉ phường/xã dựa trên tọa độ từ file Excel và các vùng GeoJSON.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- GeoJSON Input -->
                <div class="border-2 border-dashed border-blue-200 rounded-lg p-6 hover:bg-blue-50 transition-colors">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">1. Chọn các file GeoJSON (Phường/Xã)</label>
                    <input type="file" id="geojsonInput" multiple accept=".json,.geojson" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <div id="geojsonStatus" class="mt-2 text-xs text-gray-500">Chưa chọn file</div>
                </div>

                <!-- Excel Input -->
                <div class="border-2 border-dashed border-green-200 rounded-lg p-6 hover:bg-green-50 transition-colors">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">2. Chọn file Excel nguồn (.xlsx, .csv)</label>
                    <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                    <div id="excelStatus" class="mt-2 text-xs text-gray-500">Chưa chọn file</div>
                </div>
            </div>

            <div id="columnMapping" class="mt-6 hidden">
                <h3 class="font-semibold text-gray-700 mb-3">3. Cấu hình cột dữ liệu</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Cột Latitude</label>
                        <select id="latCol" class="w-full border rounded p-2 text-sm"></select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Cột Longitude</label>
                        <select id="lngCol" class="w-full border rounded p-2 text-sm"></select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Cột Địa chỉ cũ</label>
                        <select id="addrCol" class="w-full border rounded p-2 text-sm"></select>
                    </div>
                </div>
                <button id="processBtn" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-all transform hover:scale-[1.02]">
                    Bắt Đầu Xử Lý
                </button>
            </div>
        </div>

        <div id="resultCard" class="bg-white rounded-xl shadow-lg p-6 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Kết Quả</h2>
                <button id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2 px-4 rounded flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Tải File Kết Quả
                </button>
            </div>
            <div class="overflow-x-auto border rounded-lg">
                <table id="resultTable" class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr id="tableHead"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="../js/create_addressnew.js"></script>
</body>
</html>
