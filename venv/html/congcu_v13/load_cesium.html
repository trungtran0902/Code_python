<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Show GLB from Cesium ion</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.75);
      color: #00ff66;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-width: 600px;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <div id="status">Loading...</div>

  <script>
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmVhNDYwYS1mN2YxLTQ4ZjYtYTExNy03ZGVmMWYyMzYyYjkiLCJpZCI6NDMwNDA3LCJzdWIiOiJ0cnVuZ3RyYW4wOTAyIiwiaXNzIjoiaHR0cHM6Ly9pb24uY2VzaXVtLmNvbSIsImF1ZCI6IlVudGl0bGVkIiwiaWF0IjoxNzc4NTY2MTc5fQ.1pEOu9gk673XIb58ab_Lcmtp3i1RHv8ZT4_9288mYmc";

    const assetId = 4762729;

    // Tọa độ đúng của bạn
    // Bạn đưa: 11.537137, 106.896225
    // Cesium cần: longitude, latitude
    const latitude = 11.537137;
    const longitude = 106.896225;
    const height = 30;

    const statusBox = document.getElementById("status");

    function log(message) {
      console.log(message);
      statusBox.innerHTML += "<br>" + message;
    }

    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      animation: false,
      timeline: false,
      geocoder: false,
      baseLayerPicker: false,
      shouldAnimate: true,

      // Dùng nền OpenStreetMap để tránh màn hình đen
      imageryProvider: new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/"
      })
    });

    // Tắt hiệu ứng làm tối
    viewer.scene.globe.enableLighting = false;
    viewer.scene.fog.enabled = false;

    async function loadModel() {
      try {
        log("Start loading asset: " + assetId);

        const resource = await Cesium.IonResource.fromAssetId(assetId);
        log("Ion resource loaded");

        const position = Cesium.Cartesian3.fromDegrees(
          longitude,
          latitude,
          height
        );

        // Marker đỏ để kiểm tra đúng vị trí
        viewer.entities.add({
          name: "Model Position Marker",
          position: position,
          point: {
            pixelSize: 18,
            color: Cesium.Color.RED,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 3,
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          },
          label: {
            text: "MODEL HERE",
            font: "18px sans-serif",
            fillColor: Cesium.Color.YELLOW,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, -35),
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          }
        });

        const heading = Cesium.Math.toRadians(0);
        const pitch = Cesium.Math.toRadians(0);
        const roll = Cesium.Math.toRadians(0);

        const orientation = Cesium.Transforms.headingPitchRollQuaternion(
          position,
          new Cesium.HeadingPitchRoll(heading, pitch, roll)
        );

        const entity = viewer.entities.add({
          name: "GLB Model from Cesium ion",
          position: position,
          orientation: orientation,
          model: {
            uri: resource,

            // Thử scale này trước
            scale: 1.0,

            minimumPixelSize: 128,
            maximumScale: 10000,

            // Viền vàng để dễ thấy model
            silhouetteColor: Cesium.Color.YELLOW,
            silhouetteSize: 3,

            runAnimations: true
          }
        });

        log("Model entity added");

        // Bay tới đúng tọa độ
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(
            longitude,
            latitude,
            800
          ),
          orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-60),
            roll: 0
          },
          duration: 2
        });

        log("Camera moved to correct position");

      } catch (error) {
        console.error(error);
        statusBox.style.color = "red";
        statusBox.innerHTML += "<br>ERROR: " + error.message;
      }
    }

    loadModel();
  </script>
</body>
</html>
