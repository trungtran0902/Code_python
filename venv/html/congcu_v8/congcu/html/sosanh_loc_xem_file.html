<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Tool - So sánh & Xem file</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="../css/sosanh_loc_xem_file.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100 mb-8">
            <div class="flex items-center gap-4 mb-8">
                <div class="bg-blue-600 p-3 rounded-lg shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Excel Tool - So sánh & Xem file</h1>
                    <p class="text-slate-500">So sánh 2 tập cột trong cùng 1 file Excel hoặc chỉ lọc xem file.</p>
                </div>
            </div>

            <!-- B1. Upload File -->
            <div class="mb-8 p-6 border-2 border-dashed border-slate-200 rounded-2xl hover:bg-slate-50 transition-colors">
                <label class="block text-sm font-bold text-slate-700 mb-2">B1. Chọn file Excel (.xlsx, .xls)</label>
                <input type="file" id="excelInput" accept=".xlsx,.xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <div id="fileStatus" class="mt-2 text-xs text-slate-500">Chưa chọn file</div>
            </div>

            <div id="mainContent" class="hidden">
                <!-- Metrics -->
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                        <div class="text-xs font-bold text-slate-400 uppercase">Tổng số dòng</div>
                        <div id="totalRows" class="text-2xl font-bold text-slate-700">0</div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                        <div class="text-xs font-bold text-slate-400 uppercase">Tổng số cột</div>
                        <div id="totalCols" class="text-2xl font-bold text-slate-700">0</div>
                    </div>
                </div>

                <!-- B2. Choose Mode -->
                <div class="mb-8">
                    <label class="block text-sm font-bold text-slate-700 mb-4">B2. Chọn chức năng</label>
                    <div class="flex gap-4">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="toolMode" value="compare" checked class="hidden peer">
                            <div class="p-4 border-2 border-slate-100 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 transition-all text-center">
                                <div class="font-bold text-slate-700">TH1 - So sánh & xem file</div>
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="toolMode" value="view" class="hidden peer">
                            <div class="p-4 border-2 border-slate-100 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 transition-all text-center">
                                <div class="font-bold text-slate-700">TH2 - Chỉ xem file Excel</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Mode TH1: Compare -->
                <div id="compareMode" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Nguon 1 -->
                        <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 space-y-4">
                            <h3 class="font-bold text-slate-700 border-b pb-2">Cột Nguồn 1</h3>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Tên</label>
                                <select id="cN1" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Địa chỉ</label>
                                <select id="cA1" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Latitude</label>
                                <select id="cLat1" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Longitude</label>
                                <select id="cLng1" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                            </div>
                        </div>
                        <!-- Nguon 2 -->
                        <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 space-y-4">
                            <h3 class="font-bold text-slate-700 border-b pb-2">Cột Nguồn 2</h3>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Tên</label>
                                <select id="cN2" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Địa chỉ</label>
                                <select id="cA2" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Latitude</label>
                                <select id="cLat2" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Longitude</label>
                                <select id="cLng2" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase">Ngưỡng giống tên (%)</label>
                            <input type="range" id="nameThr" min="0" max="100" value="90" class="w-full">
                            <div class="text-right text-xs font-bold" id="nameThrVal">90</div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase">Ngưỡng giống địa chỉ (%)</label>
                            <input type="range" id="addrThr" min="0" max="100" value="90" class="w-full">
                            <div class="text-right text-xs font-bold" id="addrThrVal">90</div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase">Ngưỡng khoảng cách (m)</label>
                            <input type="range" id="distThr" min="0" max="500" value="30" class="w-full">
                            <div class="text-right text-xs font-bold" id="distThrVal">30</div>
                        </div>
                    </div>

                    <button id="btnRunCompare" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                        <span>Chạy so sánh</span>
                        <div id="loaderCompare" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </div>

                <!-- Mode TH2: View Only -->
                <div id="viewMode" class="hidden space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase">Chọn cột để lọc</label>
                            <select id="filterColOnly" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm"></select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase">Từ khóa lọc</label>
                            <input type="text" id="filterKeywordOnly" placeholder="Nhập từ khóa..." class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-sm">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100 hidden">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold text-slate-800">Kết quả phân tích</h2>
                    <span id="resultCount" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">0 dòng</span>
                </div>
                <button id="btnDownload" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-bold flex items-center gap-2 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Tải file Excel
                </button>
            </div>

            <!-- Multi-filter (Python-like) -->
            <div id="filterSection" class="mb-6 p-4 bg-slate-50 rounded-xl border border-slate-100 hidden">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-slate-600 uppercase">Bộ lọc kết quả</h3>
                    <button id="btnAddFilter" class="text-blue-600 text-xs font-bold hover:underline">+ Thêm điều kiện lọc</button>
                </div>
                <div id="filterConditions" class="space-y-3">
                    <!-- Dynamic filter rows -->
                </div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-600 text-[10px] font-bold uppercase tracking-wider" id="resultHead"></thead>
                    <tbody id="resultBody" class="divide-y divide-slate-100 text-slate-700 text-xs"></tbody>
                </table>
            </div>
            <p class="mt-4 text-[10px] text-slate-400">* Chỉ hiển thị tối đa 100 dòng đầu tiên để đảm bảo hiệu suất trình duyệt.</p>
        </div>
    </div>
    <script src="../js/sosanh_loc_xem_file.js"></script>
</body>
</html>
